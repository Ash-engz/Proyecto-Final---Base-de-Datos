version: '3.8'

services:
  mysql_primaria_test:
    image: mysql:8.0
    container_name: mysql_primaria_test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3309:3306"
    command: 
      - --server-id=1
      - --log-bin=mysql-bin

  mysql_replica_test:
    image: mysql:8.0
    container_name: mysql_replica_test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3309:3306"
    command: 
      - --server-id=2
      - --read-only=1
    depends_on:
      - mysql_primaria_test